# docker compose up --build   ->  UI: http://localhost:8080   API docs: http://127.0.0.1:8000/docs
services:
  api:
    build: .
    env_file: .env                     # LLM_API_KEY (Groq), JWT_SECRET, ...
    environment:
      DATABASE_URL: sqlite:////app/data/db/hospital.db
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      TZ: Asia/Kolkata                 # hospital local time
      SEED_ON_START: "true"            # fresh demo data on every start; "false" keeps bookings
    volumes:
      - hospital-db:/app/data/db
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
                VITE_API_URL: /api

    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  hospital-db:
