server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths (e.g. /login) load index.html and React Router takes over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    
    # Forward API calls to the backend container (one public address for everything).
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;        # needed for the live streaming of steps
        proxy_read_timeout 120s;
    }
}


    

